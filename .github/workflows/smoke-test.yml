# This configuration does the following:

#   It runs a short smoke test on Linux, macOS and Windows when a pull
#   request to dev changes the package, and on demand.
#   It installs the package (not in editable mode), checks the import and
#   the command line tool, then fits small BLR and HBR models.
#   The full test suite runs on Linux only, in testing.yml.

name: smoke-test

on:
  pull_request:
    branches: [dev]
    paths:
      - "pcntoolkit/**"
      - "pyproject.toml"
      - ".github/workflows/smoke-test.yml"
      - ".github/scripts/**"
  workflow_dispatch:

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    env:
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # uv installs much faster than pip, mostly on Windows.
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Install package
      run: uv pip install --system .

    # Run from outside the checkout, so that Python imports the installed package.
    - name: Check import
      working-directory: ${{ runner.temp }}
      run: python -c "import pcntoolkit; print(pcntoolkit.__version__, pcntoolkit.__file__)"

    - name: Check command line tool
      working-directory: ${{ runner.temp }}
      run: normative --help

    - name: Fit and predict with BLR and HBR
      working-directory: ${{ runner.temp }}
      run: python "${GITHUB_WORKSPACE}/.github/scripts/smoke_test.py"
