[project]
name = "pcntoolkit"
version = "1.3.0"
description = "Predictive Clinical Neuroscience Toolkit"
readme = "README.md"
license = "GPL-3.0-only"


authors = [
    { name = "Andre Marquand" },
    { name = "Stijn de Boer" },
    { name = "Konstantinos Tsilimparis" },
    { name = "Seyed Mostafa Kia" },
    { name = "Saige Rutherford" },
    { name = "Charlotte Fraza" },
    { name = "Barbora Rehák Bučková" },
    { name = "Pieter Barkema"},
    { name = "Thomas Wolfers" },
    { name = "Mariam Zabihi"},
    { name = "Richard Dinga"},
    { name = "Johanna Bayer" },
    { name = "Maarten Mennes" },
    { name = "Hester Huijsdens" },
    { name = "Linden Parkes" },
    { name = "Pierre Berthet" },
]

requires-python = ">=3.11,<3.13"

dependencies = [
    # Arrays and dataframes
    "numpy>=2.0.0",
    "scipy>=1.12",
    "pandas>=2.2.0",
    "xarray>=2024.1.0",

    # Bayesian sampling / statistics
    # For most of these packages we have upper-bounds as we had 
    # issues in the past with their new releases
    "pymc>=5.19.1,<6.0.0",
    "pytensor>=2.22.0,<3.0.0",
    "arviz>=0.21.0,<1.0.0",
    "nutpie>=0.16.5,<0.16.9",
    "numba>=0.60.0",
    "scikit-learn>=1.5.2",

    # Data I/O
    "nibabel>=5.3.1",
    "h5py>=3.11.0",
    "h5netcdf>=1.3.0",
    "cloudpickle>=3.0.0",
    "packaging>=21.3",

    # Plotting
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",

    # Parallelism and job orchestration
    "dask>=2025.11.0",
    "filelock>=3.13.0",

    # Notebook / interactive environment
    "ipywidgets>=8.1.5",
    "ipykernel>=6.29.5",
    "ipython>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "toml",
    "sphinx-tabs>=3.4.7",
    "pytest>=8.3.3",
    "black>=24.10.0",
    "pydata-sphinx-theme>=0.15.2",
    "ruff>=0.8.6",
    "coverage[toml]>=7.0.0",
    "nbconvert>=7.15.0",
]

[tool.coverage]
run.source_pkgs = ["pcntoolkit"]
run.relative_files = true
report.show_missing = true

[project.scripts]
normative = "pcntoolkit.normative:entrypoint"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcntoolkit*"]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".github", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv",
]
ignore = ["F403", "F405", "F841"]
line-length = 130
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

